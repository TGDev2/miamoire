# Configuration des services applicatifs.
# Les paramètres d'infrastructure vivent dans .env, pas ici.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            bool $debug: '%kernel.debug%'
            string $baseUrl: '%env(OPENFOODFACTS_BASE_URL)%'
            string $userAgent: '%env(OPENFOODFACTS_USER_AGENT)%'
            int $cacheTtlDays: '%env(int:PRODUCT_CACHE_TTL_DAYS)%'
            string $effort: '%env(ANTHROPIC_EFFORT)%'
            string $provider: '%env(RECIPE_PROVIDER)%'
            string $model: '%env(GEMINI_MODEL)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Objets valeur : construits à la main avec leurs données, jamais
            # injectés. Les laisser au conteneur ferait échouer l'autowiring sur
            # un `array` ou un constructeur privé, à la première référence.
            - '../src/Service/Ai/Safety/DietaryGuard.php'
            - '../src/Service/Ai/Safety/DietaryViolation.php'
            - '../src/Service/Ai/RecipeRequest.php'
            - '../src/Service/Freshness/ShelfLifeEstimate.php'
            - '../src/Service/Inventory/InventoryLine.php'
            - '../src/Service/Inventory/ReviewCandidate.php'
            - '../src/Service/Inventory/SaveTodayCandidate.php'
            - '../src/Service/Product/VariantIdentity.php'
            - '../src/Service/Stock/ConsumptionLine.php'
            - '../src/Service/Stock/FefoAllocation.php'
            - '../src/Service/Stock/FefoPlan.php'

    # Les clés d'API restent côté serveur : jamais exposées à l'application mobile.
    Anthropic\Client:
        arguments:
            $apiKey: '%env(ANTHROPIC_API_KEY)%'

    App\Service\Ai\Generator\ClaudeRecipeGenerator:
        arguments:
            $apiKey: '%env(ANTHROPIC_API_KEY)%'

    App\Service\Ai\Generator\GeminiRecipeGenerator:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'

    # `defined:` ne lève jamais d'exception : une absence se lit comme `false`,
    # jamais comme un conteneur qui refuse de se construire.
    App\Command\ConfigCheckCommand:
        arguments:
            $environment: '%kernel.environment%'
            $hasDatabaseUrl: '%env(defined:DATABASE_URL)%'
            $appSecret: '%env(APP_SECRET)%'
            $corsAllowOrigin: '%env(CORS_ALLOW_ORIGIN)%'
            $trustedProxies: '%env(TRUSTED_PROXIES)%'
