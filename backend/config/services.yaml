# Configuration des services applicatifs.
# Les paramètres d'infrastructure vivent dans .env, pas ici.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            bool $debug: '%kernel.debug%'
            string $baseUrl: '%env(OPENFOODFACTS_BASE_URL)%'
            string $userAgent: '%env(OPENFOODFACTS_USER_AGENT)%'
            int $cacheTtlDays: '%env(int:PRODUCT_CACHE_TTL_DAYS)%'
            string $effort: '%env(ANTHROPIC_EFFORT)%'
            string $provider: '%env(RECIPE_PROVIDER)%'
            string $model: '%env(GEMINI_MODEL)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Les clés d'API restent côté serveur : jamais exposées à l'application mobile.
    Anthropic\Client:
        arguments:
            $apiKey: '%env(ANTHROPIC_API_KEY)%'

    App\Service\Ai\Generator\ClaudeRecipeGenerator:
        arguments:
            $apiKey: '%env(ANTHROPIC_API_KEY)%'

    App\Service\Ai\Generator\GeminiRecipeGenerator:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
