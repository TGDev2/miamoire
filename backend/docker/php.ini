; Réglages de production. Sans OPcache, chaque requête recompile l'application.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change jamais dans une image : inutile de guetter les modifications.
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php
opcache.preload_user = root

; Les erreurs vont au flux du conteneur, jamais dans la réponse HTTP.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
memory_limit = 256M
; Les appels au générateur de recettes peuvent être longs.
max_execution_time = 120
