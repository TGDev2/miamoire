# Diffusion d'une nouvelle version aux testeurs du foyer.
#
# L'APK est compilé **ici**, sur le runner. La compilation passait auparavant par
# les serveurs d'EAS : sur le plan gratuit, elle y attend dans une file de basse
# priorité, et une diffusion a mis 1 h 35 dont quarante secondes de travail utile.
# Le runner restait bloqué pendant toute l'attente. `eas build --local` exécute
# le même processus sans la file — voir mobile/scripts/distribute-android.mjs.
#
# Déclenchée à la main, jamais sur `push` : une compilation occupe une demi-heure
# de runner. Diffuser à chaque commit épuiserait le quota Actions et noierait les
# testeurs sous les notifications — deux façons de rendre la mise à jour
# automatique plus pénible que le QR code qu'elle remplace.
name: Diffuser l'application Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (preview = APK installable directement)"
        required: false
        default: preview
      notes:
        description: "Notes de version lues par les testeurs"
        required: false
        default: ""

jobs:
  distribute:
    runs-on: ubuntu-latest
    # Une compilation qui dépasse trois quarts d'heure est cassée, pas lente. Sans
    # cette borne, un job part pour les six heures du délai par défaut de GitHub.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5
        with:
          # Le versionCode de l'APK est le nombre de commits. Le clone superficiel
          # par défaut n'en rapporterait qu'un seul, et Android refuse d'installer
          # une version dont le numéro recule. Le script s'en aperçoit et échoue,
          # mais autant lui donner ce qu'il attend.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer le JDK attendu par React Native
        # Compiler ici plutôt que sur les serveurs d'Expo, c'est hériter de leur
        # responsabilité : le JDK par défaut du runner change avec l'image, celui
        # de React Native 0.86 non.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restaurer le cache Gradle
        # Ce qui sépare une première compilation d'une demi-heure des suivantes.
        # La clé suit package-lock.json : de nouvelles dépendances natives, un
        # nouveau cache.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Installer les dépendances
        # `npm ci` sans aucun drapeau : `--legacy-peer-deps` réécrirait tout
        # l'arbre de dépendances et retirerait des pairs dont le build a besoin.
        run: npm ci

      - name: Vérifier les types avant de compiler
        # Une demi-heure de compilation pour découvrir une erreur que `tsc` voyait
        # en dix secondes, c'est une demi-heure de runner perdue.
        run: npm run typecheck

      - name: Écrire la clé du compte de service
        # Le fichier vit dans le répertoire éphémère du runner et disparaît avec
        # lui ; le secret ne touche jamais le dépôt. La variable n'est exportée
        # que si le secret existe : la pointer sur un fichier vide ferait échouer
        # la CLI Firebase sur un message sans rapport, au lieu de basculer sur le
        # repli par jeton. Le test se fait en shell et non dans un `if:` de
        # l'étape, où le contexte `secrets` n'est pas garanti disponible.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Aucun compte de service fourni : repli sur FIREBASE_TOKEN."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Compiler et diffuser
        # Les notes passent par l'environnement et non par un argument : une
        # phrase avec des espaces se ferait découper en plusieurs arguments.
        run: npm run distribute:android -- --profile "$PROFILE"
        env:
          PROFILE: ${{ inputs.profile }}
          RELEASE_NOTES: ${{ inputs.notes }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testeurs' }}
          # Repli documenté : à ne renseigner que si la CLI Firebase ignore le
          # compte de service. Voir le README.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
