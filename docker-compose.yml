services:
  database:
    image: postgres:16-alpine
    container_name: food_postgres
    environment:
      POSTGRES_DB: food
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
    ports:
      - "5433:5432"
    volumes:
      - food_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  food_pgdata:
